[project]
name = "birthday-calendar-importer"
version = "0.1.0"
description = "A modern Python tool that imports birthdays from Excel/CSV into your Google Calendar"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "colorama>=0.4.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "google-auth>=2.0.0",
    "openpyxl>=3.0.0",
    "pandas>=1.3.0",
    "python-dateutil>=2.8.0",
]
